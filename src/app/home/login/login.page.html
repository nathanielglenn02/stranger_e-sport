<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">login</ion-title>
    </ion-toolbar>
  </ion-header>

  <img src="https://ubaya.xyz/hybrid/miftah/pasta.jpg" />
  <ion-card>
    <ion-item>
      <ion-input [(ngModel)]="username" label="Username" labelPlacement="floating" />
    </ion-item>
    <ion-item>
      <ion-input [(ngModel)]="password" type="password" label="Password" labelPlacement="floating" />
    </ion-item>
    <ion-button expand="block" (click)="login()">Login</ion-button>
  </ion-card>
</ion-content>
