<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Informatic E-Sport
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="tengah">
  <ion-toolbar>
    <ion-label>Schedule</ion-label>
  </ion-toolbar>
</ion-content>

<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="who-we-are" routerLink="about">
      <ion-icon name="people-outline"></ion-icon>
      <ion-label>Who We Are</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="what-we-play" routerLink="games">
      <ion-icon name="game-controller-outline"></ion-icon>
      <ion-label>What We Play</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="our-schedule" routerLink="schedule">
      <ion-icon name="calendar-outline"></ion-icon>
      <ion-label>Schedule</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
