<ion-header class="ion-no-border">
  <ion-toolbar class="wrapper">
    <ion-item lines="none">
      <ion-label color="light">
        <div>
          <ion-icon name="locate-outline"></ion-icon>
          <ion-text>Hello Stranger</ion-text>
        </div>
        <p>Informatics E-Sport</p>
      </ion-label>
    </ion-item>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-card>
    <ion-card-header>
      <ion-card-title>Streaming & Podcast</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-list>
        <ion-item>
          <ion-thumbnail slot="start">
            <img src="../../assets/img/imgs/film.png" />
          </ion-thumbnail>
          <ion-label>
            <h2>RRQ Cookie Red Live</h2>
            <p>Ready for Stumble? | 09 Feb, 20:00 WIB</p>
          </ion-label>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>

  <ion-card-header>
    <ion-card-title>Trending this week</ion-card-title>
  </ion-card-header>
  <ion-card-content>
    <ion-grid>
      <ion-row>
        <ion-col size="6" *ngFor="let event of events">
          <ion-card>
            <ion-img [src]="event.imgSrc"></ion-img>
            <ion-card-content>
              <ion-label><strong>{{ event.title }}</strong></ion-label>
            </ion-card-content>
          </ion-card>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-card-content>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Event</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-list>
        <ion-item>
          <ion-thumbnail slot="start">
            <img src="../../assets/img/imgs/comedy.png" />
          </ion-thumbnail>
          <ion-label>
            <h2>[SURABAYA] RRQ Keliling Kota S4</h2>
            <p>27 Sep 2024 - GRATIS - Tersedia Sekarang</p>
          </ion-label>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>
</ion-content>
