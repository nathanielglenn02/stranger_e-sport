<ion-header class="ion-no-border">
  <ion-toolbar class="wrapper">
    <ion-item lines="none">
      <ion-label color="light">
        <div>
          <ion-icon name="locate-outline"></ion-icon>
          <ion-text>Hello Stranger</ion-text>
        </div>
        <p>Games</p>
      </ion-label>
    </ion-item>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col size="12" size-md="6" size-lg="4" *ngFor="let game of games">
        <ion-card class="game-card">
          <img [src]="game.image" alt="{{ game.name }}" />
          <ion-card-header>
            <ion-card-title>{{ game.name }}</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <div class="button-group">
              <ion-button fill="outline" expand="block" (click)="viewAchievements(game)">
                Achievements
              </ion-button>
              <ion-button fill="outline" expand="block" color="primary" (click)="viewTeams(game)">
                Teams
              </ion-button>
            </div>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
