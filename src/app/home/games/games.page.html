<ion-header class="ion-no-border">
  <ion-toolbar class="wrapper">
    <ion-item lines="none">
      <ion-buttons slot="start">
        <ion-back-button defaultHref="/home" text=""></ion-back-button>
      </ion-buttons>
      <ion-label color="light">
        <p>Games</p>
      </ion-label>
    </ion-item>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid>
    <ion-item *ngIf="games.length === 0" lines="none">
      <ion-label text-center>
        <p>No games available</p>
      </ion-label>
    </ion-item>

    <ion-item *ngFor="let game of games; let i = index" lines="none">
      <ion-card class="event-card">
        <ion-row>
          <ion-col size="12" class="image-col">
            <img [src]="game.image" alt="{{ game.name }}" />
          </ion-col>
          <ion-col size="12">
            <ion-card-header>
              <ion-card-title>{{ game.name }}</ion-card-title>
            </ion-card-header>
            <ion-card-content>
              <ion-button class="team" style="width: 100%;" [routerLink]="'/teams/' + game.idgame">Team</ion-button>
              <br>
              <ion-button class="achievement" style="width: 100%;"
                [routerLink]="'/achievement/' + game.idgame">Achievement
              </ion-button>
            </ion-card-content>
          </ion-col>
        </ion-row>
      </ion-card>
    </ion-item>
  </ion-grid>
</ion-content>
