<ion-header class="ion-no-border">
  <ion-toolbar class="wrapper">
    <ion-item lines="none">
      <ion-buttons slot="start">
        <ion-back-button></ion-back-button>
      </ion-buttons>
      <ion-label color="light">
        <p>Team Member</p>
      </ion-label>
    </ion-item>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let member of selectedTeam?.members" lines="none">
      <ion-card class="event-card">
        <ion-row>
          <ion-col size="12" class="image-col">
            <ion-item>

              <ion-avatar slot="start">
                <ion-img src="{{ member?.avatar }}"></ion-img>
              </ion-avatar>
            </ion-item>
          </ion-col>
          <ion-col size="12">
            <ion-card-content>
              <h2>{{ member?.nickname }}</h2>
              <p>Role :{{ member?.role }}</p>
            </ion-card-content>
          </ion-col>
        </ion-row>
      </ion-card>
    </ion-item>
  </ion-list>
</ion-content>
