<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/"></ion-back-button>
    </ion-buttons>
    <ion-title>Achievement</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-item *ngFor="let achievement of selectedGame?.achievements" lines="none">
    <ion-card class="event-card">
      <ion-row>
        <ion-col size="12" class="image-col">
          <!-- <img [src]="game.image" alt="{{ game.title }}" /> -->
        </ion-col>
        <ion-col size="12">
          <ion-card-header>
            <ion-card-title>{{ achievement?.date }}</ion-card-title>
          </ion-card-header>
        </ion-col>
      </ion-row>
    </ion-card>
  </ion-item>
</ion-content>
