<ion-header class="ion-no-border">
  <ion-toolbar class="wrapper">
    <ion-item lines="none">
      <ion-buttons slot="start">
        <ion-back-button defaultHref="/games"></ion-back-button>
      </ion-buttons>
      <ion-label color="light">
        <p>Achievement</p>
      </ion-label>
    </ion-item>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid>
    <ion-card>
      <img [src]="selectedGame?.image" />

      <ion-select label="Year" placeholder="All" okText="Choose Year" cancelText="Cancel Choice"
        [(ngModel)]="selectedYear">
        <ion-select-option value="All">All</ion-select-option> <!-- Default option for showing all years -->
        <ion-select-option *ngFor="let year of distinctYears" [value]="year">
          {{ year }}
        </ion-select-option>
      </ion-select>

      <ng-container *ngFor="let achievement of getFilteredAchievements(); let i = index">
        <ion-card-content>
          <ion-label>{{ i + 1 }}. {{ achievement.title }} - {{ achievement.year }}</ion-label><br>
          <ion-label>{{ achievement.team }}</ion-label>
        </ion-card-content>
      </ng-container>
    </ion-card>
  </ion-grid>
</ion-content>
