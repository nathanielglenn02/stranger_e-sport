<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/"></ion-back-button>
    </ion-buttons>
    <ion-title>schedule</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let event of events" (click)="viewEventDetails(event)">
      <ion-thumbnail slot="start">
        <img [src]="event.image" />
      </ion-thumbnail>
      <ion-label>
        <h2>{{ event.title }}</h2>
        <p>{{ event.date | date: 'mediumDate' }} - {{ event.time }}</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
