<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Schedule</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let event of events" lines="none" (click)="viewEventDetails(event)">
      <ion-card class="event-card">
        <ion-row>
          <ion-col size="12" class="image-col">
            <img [src]="event.image" alt="{{ event.title }}" />
          </ion-col>
          <ion-col size="12">
            <ion-card-header>
              <ion-card-subtitle>
                {{ event.date | date: 'mediumDate' }} - {{ event.time }}
              </ion-card-subtitle>
              <ion-card-title>{{ event.title }}</ion-card-title>
            </ion-card-header>
            <ion-card-content>
              <p>Game Mode: {{ event.gameMode }}</p>
              <p>Platform: {{ event.platform }}</p>
              <ion-chip color="success">
                <ion-icon name="trophy-outline"></ion-icon>
                <ion-label>{{ event.prize }}</ion-label>
              </ion-chip>
              <ion-chip color="warning">
                <ion-icon name="people-outline"></ion-icon>
                <ion-label>{{ event.participants }}</ion-label>
              </ion-chip>
              <ion-chip color="primary">
                <ion-label>UPCOMING</ion-label>
              </ion-chip>
            </ion-card-content>
          </ion-col>
        </ion-row>
      </ion-card>
    </ion-item>
  </ion-list>
</ion-content>
